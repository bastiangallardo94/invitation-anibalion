<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fde7f3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <g>
    <circle cx="90" cy="140" r="14" fill="#facc15"/>
    <rect x="140" y="90" width="20" height="20" rx="4" fill="#f472b6" transform="rotate(25 150 100)"/>
    <circle cx="700" cy="120" r="16" fill="#34d399"/>
    <rect x="640" y="180" width="18" height="18" rx="4" fill="#f87171" transform="rotate(40 649 189)"/>
    <circle cx="720" cy="860" r="15" fill="#facc15"/>
    <rect x="70" y="800" width="20" height="20" rx="4" fill="#60a5fa" transform="rotate(15 80 810)"/>
    <circle cx="160" cy="900" r="12" fill="#f472b6"/>
    <rect x="600" y="920" width="22" height="22" rx="4" fill="#34d399" transform="rotate(-20 611 931)"/>
  </g>

  <rect x="90" y="130" width="620" height="740" rx="28" fill="url(#card)" stroke="#e0c8e8" stroke-width="6"/>

  <text x="400" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#7c3aed">¡Feliz Cumpleaños!</text>

  <g transform="translate(400 320)">
    <rect x="-120" y="-20" width="240" height="40" rx="6" fill="#f472b6"/>
    <rect x="-90" y="-70" width="180" height="50" rx="6" fill="#fbbf24"/>
    <rect x="-120" y="-20" width="240" height="10" fill="#fff7ed" opacity="0.7"/>
    <rect x="-90" y="-70" width="180" height="10" fill="#fff7ed" opacity="0.7"/>
    <g stroke="#fff" stroke-width="4" stroke-linecap="round">
      <line x1="-160" y1="-160" x2="-150" y2="-120"/>
      <line x1="-120" y1="-180" x2="-115" y2="-130"/>
      <line x1="120" y1="-180" x2="115" y2="-130"/>
      <line x1="160" y1="-160" x2="150" y2="-120"/>
    </g>
    <g fill="#fff7ed">
      <circle cx="-160" cy="-160" r="6"/>
      <circle cx="-120" cy="-180" r="6"/>
      <circle cx="120" cy="-180" r="6"/>
      <circle cx="160" cy="-160" r="6"/>
    </g>
    <circle cx="0" cy="-185" r="7" fill="#facc15"/>
  </g>

  <text x="400" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#374151">[Nombre del cumpleañero]</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="530" font-size="24" font-weight="700" fill="#7c3aed">CUÁNDO</text>
    <text x="400" y="560" font-size="26" fill="#374151">Sábado 20 de Junio</text>
    <text x="400" y="590" font-size="26" fill="#374151">5:00 PM</text>

    <text x="400" y="650" font-size="24" font-weight="700" fill="#7c3aed">DÓNDE</text>
    <text x="400" y="680" font-size="26" fill="#374151">[Dirección del lugar]</text>

    <text x="400" y="740" font-size="24" font-weight="700" fill="#7c3aed">RSVP</text>
    <text x="400" y="770" font-size="24" fill="#374151">Confirmar antes del 15 de Junio</text>
    <text x="400" y="800" font-size="20" fill="#9ca3af">[Teléfono / WhatsApp]</text>
  </g>

  <text x="400" y="845" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b7280">¡No faltes, será una fiesta explosiva!</text>
</svg>
